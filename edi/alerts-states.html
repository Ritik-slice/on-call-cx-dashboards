<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alerts card — states &amp; edge cases (EDI) · Spacce CX</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { background: #F1F1F6; }
  .spec-top .sp-qa-btn { text-decoration: none; }
  .spec-top .nav { display: flex; gap: 10px; align-items: center; }
</style>
</head>
<body>
  <div class="spec-top">
    <div><h2>Alerts card — states &amp; edge cases (EDI)</h2><span class="sub">Visual reference for the EDI dashboard's deriveAlerts() rule catalog — rank order P0 → P1 → info, sorted, plain language</span></div>
    <div class="nav">
      <details class="devnav">
        <summary class="sp-qa-btn">Dev references ▾</summary>
        <div class="devnav-menu">
          <a href="alerts-states.html" class="active">Alerts card states</a>
          <a href="checks-states.html">Checks states</a>
          <a href="event-delivery-states.html">Event delivery states</a>
        </div>
      </details>
      <a href="index.html" class="sp-qa-btn">← Back to dashboard</a>
    </div>
  </div>
  <div class="spec-wrap" id="alertsSpecBody"></div>

<script>
// Alerts-states spec gallery (EDI) — mirrors the DCA tool's alerts-states.html pattern.
// Rule catalog per edi/index.html's deriveAlerts().
function _ai(level, title, body) {
  return `<div class="alert alert-${level}"><span class="alert-label">${level.toUpperCase()}</span><strong>${title}</strong><br>${body}</div>`;
}
function _acell(caption, headerTag, bodyHtml, scroll) {
  return `<div class="spec-cell${scroll ? " spec-scroll" : ""}">
    <div class="spec-caption">${caption}</div>
    <div class="card">
      <div class="card-header"><span class="card-title">Alerts</span>${headerTag}</div>
      <div class="card-body" style="padding:14px 18px;">${bodyHtml}</div>
    </div>
  </div>`;
}
function buildAlertsSpec() {
  const clear = `<span class="tag tag-active">CLEAR</span>`;
  const count = n => `<span class="tag tag-stuck">${n} active</span>`;
  const countInfo = n => `<span class="tag tag-review">${n} active</span>`;

  const p0 = [
    _acell(`<span class="tagref">P0</span><b>Fraud hard block / blacklisted</b>`, count(1),
      _ai("p0", "Fraud hard block / blacklisted", "USER_BLACKLISTED. Owner: Fraud squad.")),
    _acell(`<span class="tagref">P0</span><b>VKYC rejected</b>`, count(1),
      _ai("p0", "VKYC rejected", "Rejection reason: DOCUMENT_MISMATCH.")),
    _acell(`<span class="tagref">P0</span><b>Risk rejected</b> — only fires when NOT waitlisted (see the dedicated waitlist edge case below).`, count(1),
      _ai("p0", "Risk rejected", "Risk decision rejected.")),
    _acell(`<span class="tagref">P0</span><b>Declined post-audit</b>`, count(1),
      _ai("p0", "Declined post-audit", "CONCURRENT_AUDIT_REVIEW_DECLINED. Owner: Review/Audit team.")),
    _acell(`<span class="tagref">P0</span><b>SIM binding hard fail</b>`, count(1),
      _ai("p0", "SIM binding hard fail", "INTEGRITY_BREACH. Owner: Trust & Safety.")),
    _acell(`<span class="tagref">P0</span><b>AML possible match</b>`, count(1),
      _ai("p0", "AML possible match", "Name/entity possible match flagged by AML screening.")),
    _acell(`<span class="tagref">P0</span><b>Manual review rejected</b>`, count(1),
      _ai("p0", "Manual review rejected", "Business address could not be verified. Owner: KYC Ops.")),
    _acell(`<span class="tagref">P0</span><b>VKYC link generation failed</b>`, count(1),
      _ai("p0", "VKYC link generation failed", "VKYC link could not be generated. Check VKYC service status.")),
  ];

  const p1 = [
    _acell(`<span class="tagref">P1</span><b>Dedupe conflict</b>`, count(1),
      _ai("p1", "Dedupe conflict -- existing account", "Owner: UID team.")),
    _acell(`<span class="tagref">P1</span><b>GST not verified -- may be gating</b> (SANCTIONED state)`, count(1),
      _ai("p1", "GST not verified -- may be gating", "May block disbursement depending on CPV region.")),
    _acell(`<span class="tagref">P1</span><b>GST invalid / cancelled</b>`, count(1),
      _ai("p1", "GST invalid / cancelled", "Entered GST is invalid, cancelled, or linked to a different PAN.")),
    _acell(`<span class="tagref">P1</span><b>VKYC pending</b>`, count(1),
      _ai("p1", "VKYC pending", "No update since scheduling.")),
    _acell(`<span class="tagref">P1</span><b>VKYC skipped</b> — pre-VKYC fraud hard block`, count(1),
      _ai("p1", "VKYC skipped", "VKYC was skipped due to a pre-VKYC fraud hard block.")),
    _acell(`<span class="tagref">P1</span><b>VKYC -- no agents / timeout</b>`, count(1),
      _ai("p1", "VKYC -- no agents available", "No VKYC agents available in the user's region.")),
    _acell(`<span class="tagref">P1</span><b>In audit review</b>`, count(1),
      _ai("p1", "In audit review", "Since 2026-08-05 12:00.")),
    _acell(`<span class="tagref">P1</span><b>AA bank linking failed</b>`, count(1),
      _ai("p1", "AA bank linking failed", "Some banks failed OTP during Account Aggregator step.")),
    _acell(`<span class="tagref">P1</span><b>SIM binding failed (soft)</b>`, count(1),
      _ai("p1", "SIM binding failed (soft)", "DEVICEID_MISS_MATCH.")),
    _acell(`<span class="tagref">P1</span><b>In manual review</b>`, count(1),
      _ai("p1", "In manual review", "FIA review pending since 2026-07-20 10:00.")),
    _acell(`<span class="tagref">P1</span><b>AML screening pending</b>`, count(1),
      _ai("p1", "AML screening pending", "AML check has not completed yet.")),
  ];

  const info = [
    _acell(`<span class="tagref">info</span><b>Waitlisted with actionable items</b> — the risk-rejected-but-everything-else-clean case`, countInfo(1),
      _ai("info", "Waitlisted with actionable items", "User sees waitlist screen with score and improvement steps.")),
    _acell(`<span class="tagref">info</span><b>Non-individual PAN entered</b> — same individual/sole-prop-only policy as DCA`, countInfo(1),
      _ai("info", "Non-individual PAN entered", "PAN type: Partnership (Firm) -- only individual/sole-prop PAN is accepted for EDI, same policy as DCA.")),
    _acell(`<span class="tagref">info</span><b>CKYC fallback to Aadhaar</b>`, countInfo(1),
      _ai("info", "CKYC fallback to Aadhaar", "CKYC data was found but the record was invalid/expired. User fell back to the Aadhaar path.")),
    _acell(`<span class="tagref">info</span><b>Application abandoned</b>`, countInfo(1),
      _ai("info", "Application abandoned", "Idle for 65 days. No user activity detected.")),
    _acell(`<span class="tagref">info</span><b>Journey reset detected</b>`, countInfo(1),
      _ai("info", "Journey reset detected", "1 step(s) have been reset. Check timeline for details.")),
    _acell(`<span class="tagref">A-7</span><b>CLEAR</b> — zero alerts, journey healthy.`, clear,
      `<div class="alert alert-info"><strong>No active alerts</strong> — journey looks healthy.</div>`),
  ];

  const edges = [
    _acell(`<span class="tagref">waitlist edge case</span><b>Risk REJECTED + VKYC approved + no dedupe + no fraud + no redflag</b> — routes to Waitlist, P0 "Risk rejected" is suppressed because state = WAITLISTED, only the info alert fires.`,
      countInfo(1),
      _ai("info", "Waitlisted with actionable items", "Risk rejected (score 38/100) even though VKYC is approved, there is no dedupe conflict, no fraud flag, and zero redflag rows. Risk rejection alone routes to Waitlist -- Sanction Screen is never shown.")),
    _acell(`<span class="tagref">multi-alert</span><b>Show all, sorted P0 → P1 → info</b> — no cap, list scrolls.`, count(3),
      _ai("p0", "Fraud hard block / blacklisted", "USER_BLACKLISTED.") +
      _ai("p1", "Dedupe conflict -- existing account", "Owner: UID team.") +
      _ai("info", "Journey reset detected", "1 step(s) have been reset."), true),
    _acell(`<span class="tagref">out of scope</span><b>DCA-flagged application</b> → no EDI Alerts card at all; the out-of-scope empty state renders instead.`,
      countInfo(0),
      `<div class="sp-noscope" style="margin:0;border:none;padding:26px 20px;">
        <div class="sp-noscope-icon">◌</div><h3 style="font-size:14px;">This application is DCA, not EDI</h3>
        <p class="sp-muted" style="font-size:12px;">This dashboard covers EDI (merchant lending) only — routes to the DCA on-call tool.</p>
      </div>`),
  ];

  document.getElementById("alertsSpecBody").innerHTML =
    `<div class="spec-section-title">P0 rules</div>` +
    `<div class="spec-grid">${p0.join("")}</div>` +
    `<div class="spec-section-title">P1 rules</div>` +
    `<div class="spec-grid">${p1.join("")}</div>` +
    `<div class="spec-section-title">Info rules</div>` +
    `<div class="spec-grid">${info.join("")}</div>` +
    `<div class="spec-section-title">Edge cases</div>` +
    `<div class="spec-grid">${edges.join("")}</div>`;
}
buildAlertsSpec();
</script>
</body>
</html>
