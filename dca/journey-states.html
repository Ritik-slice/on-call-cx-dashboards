<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding journey — states per milestone (DCA) · Spacce CX</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { background: #F1F1F6; }
  .spec-top .sp-qa-btn { text-decoration: none; }
  .spec-cell .tl-card { box-shadow: 0 2px 10px rgba(30,30,60,.07); }
  .spec-section-title .ms-sub { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); margin-left: 8px; }
  .spec-top .nav { display: flex; gap: 10px; align-items: center; }
</style>
</head>
<body>
  <div class="spec-top">
    <div><h2>Onboarding journey — states per milestone (DCA)</h2><span class="sub">Visual reference for PRD_ops_dashboard_dca.md §7.5 &amp; §8 · one section per stage, rendered by render.js</span></div>
    <div class="nav">
      <details class="devnav">
        <summary class="sp-qa-btn">Dev references ▾</summary>
        <div class="devnav-menu">
          <a href="journey-states.html" class="active">Journey states</a>
          <a href="alerts-states.html">Alerts card states</a>
          <a href="checks-states.html">Checks states</a>
          <a href="event-delivery-states.html">Event delivery states</a>
        </div>
      </details>
      <a href="index.html" class="sp-qa-btn">← Back to dashboard</a>
    </div>
  </div>
  <div class="spec-wrap" id="journeySpecBody"></div>

<script src="render.js"></script>
<script>
// Journey-states gallery (DCA) — organised BY MILESTONE (PRD §8.0's 10-stage canonical
// model, derived from the last flag in `flags`). Each stage is a section; each cell is one
// probable/edge case, rendered by the production renderStep(). NOTE: most cells show "—"
// for timestamp deliberately (PRD §0.1/J-5) — only VKYC, audit, and account-creation cells
// carry a real one, because only those are backed by a genuinely timestamped table.
let _ji = 0;
function _jcell(caption, steps) {
  const inner = steps.map((s, k) => renderStep(s, k === steps.length - 1, _ji++, null)).join("");
  return `<div class="spec-cell">
    <div class="spec-caption">${caption}</div>
    <div class="tl-card"><div class="tl-list">${inner}</div></div>
  </div>`;
}
const _C = (owner, desc, steps) => _jcell(`<span class="tagref">${owner}</span>${desc}`, steps);

function buildJourneySpec() {
  const milestones = [

    { n: "1", title: "Consent / TnC", sub: "CONSENT_CAPTURED / BUSINESS_PAN_SKIPPED → lands at PAN Screen", cells: [
      _C("happy", "<b>Happy path</b> — consent captured, proceeds to PAN Screen.",
        [{ num:"01", name:"Consent / TnC", status:"done", detail:"CONSENT_CAPTURED — landed at PAN Screen", ts:"2026-07-28 09:00" }]),
      _C("A2 (assumed)", "<b>Business PAN entry skipped</b> — alternate path (BUSINESS_PAN_SKIPPED).",
        [{ num:"01", name:"Consent / TnC", status:"done", detail:"BUSINESS_PAN_SKIPPED — alternate path taken, still landed at PAN Screen", fields:["Path: BUSINESS_PAN_SKIPPED"] }]),
      _C("A2 (assumed)", "<b>Stuck before consent captured</b> — no flags present at all.",
        [{ num:"01", name:"Consent / TnC", status:"stuck", detail:"No flags present — application effectively hasn't started" }]),
    ]},

    { n: "2", title: "PAN Screen", sub: "CKYC_SKIPPED → lands at Business Category", cells: [
      _C("happy", "<b>Happy path</b> — business PAN entered, CKYC check skipped, proceeds.",
        [{ num:"02", name:"PAN Screen", status:"done", detail:"Business PAN entered · CKYC check skipped", ts:"2026-07-28 09:08" }]),
      _C("UID team", "<b>PAN dedupe</b> — existing account under a different UUID.",
        [{ num:"02", name:"PAN Screen", status:"stuck", detail:"Business PAN already registered under a different UUID",
           dedupeBlock:{ blocked:true, reasonLabel:"PAN_DEDUPE_EXISTS_WITH_DIFFERENT_UUID", duplicateUUID:"9f3e2d11-aaaa-4bbb-8ccc-111122223333", duplicateStatus:"ACTIVE" } }]),
      _C("UID team", "<b>Cross-product dedupe</b> — collides with an existing mini/savings/borrow onboarding.",
        [{ num:"02", name:"PAN Screen", status:"stuck", detail:"Matched an existing onboarding in a different product",
           dedupeBlock:{ blocked:true, reasonLabel:"PAN_EXISTS_WITH_DIFFERENT_UUID_IN_SAVINGS_ONBOARDING", duplicateUUID:"a1b2c3d4-5555-4666-8777-888899990000", duplicateStatus:"ACTIVE", product:"Savings onboarding" }}]),
      _C("UID team (assumed)", "<b>Existing bank user</b> — already a customer.",
        [{ num:"02", name:"PAN Screen", status:"stuck", detail:"EXISTING_BANK_USER redflag matched",
           dedupeBlock:{ blocked:true, reasonLabel:"EXISTING_BANK_USER", duplicateUUID:"c3d4e5f6-1111-4222-9333-444455556666", duplicateStatus:"ACTIVE" } }]),
    ]},

    { n: "3", title: "Business Category (CKYC check)", sub: "PAN_VERIFIED → lands at Business Details Screen", cells: [
      _C("happy", "<b>Happy path</b> — category selected, PAN verified, proceeds.",
        [{ num:"03", name:"Business Category (CKYC check)", status:"done", detail:"CKYC_SKIPPED — landed at Business Category · category selected, PAN_VERIFIED reached", ts:"2026-07-28 09:12" }]),
      _C("A2 (assumed)", "<b>Stuck with no forward flag</b> — no richer probable-case detail available from the given schema facts; flagged for the future DCA escalation-corpus pass rather than invented (PRD §8.0, Milestone 3 note).",
        [{ num:"03", name:"Business Category (CKYC check)", status:"stuck", detail:"Last flag = CKYC_SKIPPED, no PAN_VERIFIED yet" }]),
    ]},

    { n: "4", title: "Business Details (GST / Udyam)", sub: "BUSINESS_DETAILS_SUBMITTED → lands at AADHAR/DIGIO · GST/Udyam attribute here", cells: [
      _C("happy", "<b>Both verified</b> — GST and Udyam both present.",
        [{ num:"04", name:"Business Details (GST/Udyam)", status:"done", detail:"PAN_VERIFIED — landed at Business Details · both verified",
           gstUdyam:{ gst:"verified", udyam:"verified" }, ts:"2026-07-28 09:23" }]),
      _C("info", "<b>GST not verified, Udyam present</b> — non-gating today; progresses normally.",
        [{ num:"04", name:"Business Details (GST/Udyam)", status:"done", detail:"Udyam mandatory gate satisfied, GST not verified but non-gating",
           gstUdyam:{ gst:"not_verified", udyam:"verified" } }]),
      _C("GST/Udyam owner (assumed)", "<b>Udyam not verified — mandatory block</b>. GST verified but irrelevant to the gate.",
        [{ num:"04", name:"Business Details (GST/Udyam)", status:"stuck", detail:"Udyam Aadhaar number is the empty-hash value — mandatory gate not satisfied",
           gstUdyam:{ gst:"verified", udyam:"not_verified" } }]),
      _C("A2 (data hygiene)", "<b>Empty-hash false alarm</b> — CX reports \"no GST on file\" when a value technically exists as a non-empty hash.",
        [{ num:"04", name:"Business Details (GST/Udyam)", status:"warn", detail:"Raw gst_number is a non-empty hash — do not read as absent; a naive IS NOT NULL check would also be wrong here",
           fields:[{v:"gst_number: non-empty hash",ok:true},{v:"Do not read as missing",warn:true}] }]),
      _C("capability gap", "<b>Udyam captured manually</b> — no auto-fetch confirmation signal exists for DCA (unlike EDI's udyam_ref concept).",
        [{ num:"04", name:"Business Details (GST/Udyam)", status:"warn", detail:"Udyam verified via manual submission only — cannot distinguish auto vs manual for DCA",
           gstUdyam:{ gst:"verified", udyam:"verified" }, fields:[{v:"Auto-fetch confirmation: not available for DCA",warn:true}] }]),
      _C("data hygiene", "<b>merchant_info.gst_no disagrees</b> — dead column, never surfaced.",
        [{ num:"04", name:"Business Details (GST/Udyam)", status:"warn", detail:"merchant_info.gst_no is a dead/untrustworthy column — not used for this check, business_details.gst_number is authoritative",
           gstUdyam:{ gst:"verified", udyam:"verified" } }]),
    ]},

    { n: "5", title: "Aadhaar / Digio", sub: "DETAILS_VERIFIED → lands at PRE_VKYC", cells: [
      _C("happy", "<b>Happy path</b> — Aadhaar/Digio verification completes.",
        [{ num:"05", name:"Aadhaar / Digio", status:"done", detail:"BUSINESS_DETAILS_SUBMITTED — landed at Aadhaar/Digio · verification complete", ts:"2026-07-28 09:45" }]),
      _C("A2 (assumed)", "<b>Stuck, no forward flag</b> — no richer probable-case detail available from the given schema facts (PRD §8.0, Milestone 5 note).",
        [{ num:"05", name:"Aadhaar / Digio", status:"stuck", detail:"Last flag = BUSINESS_DETAILS_SUBMITTED, no DETAILS_VERIFIED yet" }]),
    ]},

    { n: "6", title: "Verify details (PRE_VKYC)", sub: "VKYC_VERIFIED → lands at VKYC_COMPLETED", cells: [
      _C("happy", "<b>Happy path</b> — details verified, proceeds to VKYC.",
        [{ num:"06", name:"Verify details (PRE_VKYC)", status:"done", detail:"DETAILS_VERIFIED — landed at PRE_VKYC", ts:"2026-07-28 10:00" }]),
      _C("A2 (assumed)", "<b>Stuck at Verify Details</b> — confirmed details, no forward movement.",
        [{ num:"06", name:"Verify details (PRE_VKYC)", status:"stuck", detail:"Last flag = DETAILS_VERIFIED, no VKYC_VERIFIED yet" }]),
    ]},

    { n: "7", title: "VKYC", sub: "MOVED_TO_AUDIT → moves to audit review", cells: [
      _C("happy", "<b>Approved</b>.", [{ num:"07", name:"VKYC", status:"done", detail:"VKYC_VERIFIED — landed at VKYC_COMPLETED", vkycOutcome:{ status:"APPROVED", ts:"2026-07-30 15:05" } }]),
      _C("VKYC ops", "<b>Rejected</b> — reason visible via vkyc_details (P0).",
        [{ num:"07", name:"VKYC", status:"stuck", detail:"Rejected — reason from vkyc_details.rejection_reason (product_flow=15)", vkycOutcome:{ status:"REJECTED", rejectionReason:"FACE_MISMATCH", ts:"2026-07-26 11:20" } }]),
      _C("VKYC ops", "<b>Pending</b> — no update since scheduling.",
        [{ num:"07", name:"VKYC", status:"warn", detail:"Awaiting outcome", vkycOutcome:{ status:"PENDING", ts:"2026-07-27 13:00" } }]),
      _C("data contract", "<b>Redflags/VKYC double-count guard</b> — VKYC_REJECTED/VKYC_PENDING redflag rows are excluded from the Fraud/redflag bucket when vkyc_details is the VKYC source.",
        [{ num:"07", name:"VKYC", status:"stuck", detail:"Rejected — shown once here via vkyc_details; the same-signal redflag row is intentionally not also counted in the Fraud/redflag check", vkycOutcome:{ status:"REJECTED", rejectionReason:"DOCUMENT_UNCLEAR", ts:"2026-07-26 11:20" } }]),
    ]},

    { n: "8", title: "Audit review", sub: "KYC_APPROVED / KYC_DECLINED → terminal Decision", cells: [
      _C("Review/Audit (assumed)", "<b>Under review</b> — entry time is an updated_at proxy, not a true entry timestamp.",
        [{ num:"08", name:"Audit review", status:"warn", detail:"MOVED_TO_AUDIT — routed to audit, awaiting outcome", auditOutcome:{ outcome:"under_review", ts:"2026-07-29 08:00" } }]),
      _C("Review/Audit (assumed)", "<b>Approved (post-audit)</b>.",
        [{ num:"08", name:"Audit review", status:"done", detail:"MOVED_TO_AUDIT — routed to audit, then approved", auditOutcome:{ outcome:"approved", ts:"2026-07-29 17:15" } }]),
      _C("Review/Audit (assumed)", "<b>Declined</b> — CONCURRENT_AUDIT_REVIEW_DECLINED.",
        [{ num:"08", name:"Audit review", status:"stuck", detail:"MOVED_TO_AUDIT — routed to audit, then declined", auditOutcome:{ outcome:"declined", note:"CONCURRENT_AUDIT_REVIEW_DECLINED", ts:"2026-07-29 17:15" } }]),
      _C("—", "<b>Not routed to audit</b> — direct approval path, this milestone is skipped.",
        [{ num:"08", name:"Audit review", status:"skip", detail:"Not routed to audit — direct approval path" }]),
    ]},

    { n: "9", title: "Decision", sub: "terminal — Approved / Rejected", cells: [
      _C("—", "<b>Approved</b>.", [{ num:"09", name:"Decision", status:"done", detail:"KYC_APPROVED", ts:"2026-07-31 08:30" }]),
      _C("A2 (assumed)", "<b>Rejected — no matching redflag ('other')</b> — flag for investigation (mirrors the source PRD's Milestone-9 pattern).",
        [{ num:"09", name:"Decision", status:"stuck", detail:"KYC_DECLINED — no matching row in slice_x_redflags for this uuid",
           fields:[{v:"Decline reason present: NO",bad:true},"→ flag for investigation"] }]),
      _C("Fraud squad", "<b>Rejected — fraud bucket</b> — already surfaced upstream at whichever milestone the redflag fired.",
        [{ num:"09", name:"Decision", status:"stuck", detail:"KYC_DECLINED — USER_BLACKLISTED redflag (see PAN Screen / Milestone 2)" }]),
    ]},

    { n: "10", title: "Current Account creation", sub: "user_states.property_value = CURRENT_ACCOUNT_CREATED", cells: [
      _C("A2 (assumed)", "<b>Account not created (P0)</b> — the DCA analogue of the source tool's largest bucket. KYC approved, no property row.",
        [{ num:"10", name:"Current Account creation", status:"stuck", detail:"KYC approved, but no CURRENT_ACCOUNT_CREATED property row exists in user_states",
           fields:[{v:"KYC_APPROVED: YES",ok:true},{v:"CURRENT_ACCOUNT_CREATED: not found",bad:true}],
           accountCreation:{ nodes:[{name:"KYC",status:"pass"},{name:"Redflag",status:"pass"},{name:"Account",status:"blocked",reason:"no user_states row"}] } }]),
      _C("—", "<b>Created</b> — happy path terminal state.",
        [{ num:"10", name:"Current Account creation", status:"done", detail:"CURRENT_ACCOUNT_CREATED property set",
           accountCreation:{ nodes:[{name:"KYC",status:"pass"},{name:"Redflag",status:"pass"},{name:"Account",status:"pass"}] }, ts:"2026-08-01 11:40" }]),
      _C("A2 (assumed)", "<b>Approved but core-banking confirmation absent/delayed</b> — approval state vs core-banking presence side by side.",
        [{ num:"10", name:"Current Account creation", status:"warn", detail:"Approved; core-banking (bsgcore_gold/bsgaccounting_gold) confirmation not yet visible",
           fields:[{v:"Approved: YES",ok:true},{v:"Core-banking confirmation: pending",warn:true}] }]),
    ]},

  ];

  document.getElementById("journeySpecBody").innerHTML = milestones.map(m =>
    `<div class="spec-section-title">Milestone ${m.n} · ${m.title}<span class="ms-sub">${m.sub}</span></div>` +
    `<div class="spec-grid">${m.cells.join("")}</div>`
  ).join("");
}
buildJourneySpec();
</script>
</body>
</html>
